services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy  # ждём готовности БД, а не просто старта контейнера
    ports:
      # Порт хоста настраивается через .env (BACKEND_PORT), если 8000 занят.
      - "${BACKEND_PORT:-8000}:8000"

  bot:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    # Тот же образ, но вместо API запускаем polling-бота.
    entrypoint: ["python", "-m", "app.bot"]
    # on-failure: без токена бот завершается штатно (exit 0) и не рестартует;
    # при реальном падении с токеном — перезапустится.
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      args:
        # Адрес, по которому БРАУЗЕР обращается к API (не имя docker-сервиса).
        # Должен совпадать с BACKEND_PORT выше.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  pg_data:
